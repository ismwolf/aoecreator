[project]
name = "aeogen"
version = "0.0.0"
description = "aeogenerator FastAPI backend — AEO/GEO multi-agent SaaS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "UNLICENSED" }
authors = [{ name = "aeogenerator team" }]
dependencies = [
  "fastapi>=0.115.0,<0.116",
  "langchain-core>=0.3,<0.4",
  "langgraph>=0.6,<0.7",
  "langgraph-checkpoint-postgres>=3.0,<3.1",
  "langsmith>=0.5,<0.6",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "supabase>=2.6,<3",
  "uvicorn[standard]>=0.32,<0.33",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.9,<0.7",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.25",
  "httpx>=0.27,<0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeogen"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "ASYNC", "RUF"]
ignore = [
  "ANN101", # missing self type — deprecated rule, kept off for clarity
  "ANN102", # missing cls type — same
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]  # tests may skip return-type annotations on fixtures

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
show_error_codes = true
files = ["src/aeogen"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
