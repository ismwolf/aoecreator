name: CI

# Run on pushes to long-lived branches and on every PR targeting them.
# feature/** branches are covered by pull_request events (avoids duplicate
# runs when a feature branch push and its open PR fire simultaneously).
on:
  push:
    branches:
      - dev
      - test
      - main
  pull_request:
    branches:
      - dev
      - test
      - main

# Cancel in-flight runs for the same ref when a new commit lands. Saves CI
# minutes and prevents stale "failing" statuses from racing the latest push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-checks:
    name: Node (pnpm) — typecheck · lint · build · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Placeholder env so `@t3-oss/env-nextjs` validation passes during
    # `next build`. Real values come from Vercel / Hostinger env at deploy
    # time. The publishable key MUST match `sb_publishable_*` (see env.ts
    # regex) and the URL must be a valid URL — these are NOT secrets.
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_xxxxxxxxxxxxxxxxxxxx
      SUPABASE_SECRET_KEY: sb_secret_placeholder_xxxxxxxxxxxxxxxxxxxx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (workspace)
        run: pnpm -r typecheck

      - name: Lint (workspace)
        run: pnpm -r lint

      - name: Format check (prettier)
        run: pnpm prettier --check .

      - name: Build (workspace)
        run: pnpm -r build

      - name: Test (workspace)
        run: pnpm -r test

      - name: Drift check (shared Zod↔Pydantic)
        run: pnpm --filter @aeogen/shared check:drift

  python-checks:
    name: Python (uv) — ruff · mypy · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/api

    # `apps/api/tests/conftest.py` sets test defaults at import time, but we
    # still inject placeholders here so any direct `uv run` against
    # `aeogen.settings` outside pytest does not crash on a missing var.
    env:
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_xxxxxxxxxxxxxxxxxxxx
      SUPABASE_SECRET_KEY: sb_secret_placeholder_xxxxxxxxxxxxxxxxxxxx
      DATABASE_URL: postgresql+asyncpg://placeholder:placeholder@localhost:5432/placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (with dev extras)
        run: uv sync --extra dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Typecheck (mypy strict)
        run: uv run mypy src

      - name: Test (pytest)
        run: uv run pytest -v

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
